version: "3.9"

services:

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  phishing_ai:
    build:
      context: ./phishing_ai
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      MODEL_PATH: ${MODEL_PATH}
      DECISION_THRESHOLD: ${DECISION_THRESHOLD}
    healthcheck:
      # python:slim no trae curl; se verifica con Python.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5

  phishing_detector:
    build:
      context: ./PhishingDetector
    restart: unless-stopped
    ports:
      - "5000:80"
    depends_on:
      postgres:
        condition: service_healthy
      phishing_ai:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: >
        Host=postgres;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      FastApi__BaseUrl: "http://phishing_ai:8000"

volumes:
  postgres_data:
